<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberLab CBT — Plataforma de práctica</title>
<style>
  :root{
    --navy:#0B1E33; --navy2:#122a45; --teal:#1C7293; --seafoam:#21B0A8;
    --amber:#E8A33D; --coral:#E2654A; --paper:#F5F7FA; --ink:#1A2733; --gray:#7A8794;
    --line:#e2e8f0; --green:#2f9e5f;
    --head:Georgia,'Times New Roman',serif; --body:'Segoe UI',system-ui,Calibri,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.55}
  a{color:inherit;text-decoration:none;cursor:pointer}
  code{font-family:'Consolas',ui-monospace,monospace;background:#0d2136;color:#7fe3d6;padding:2px 6px;border-radius:5px;font-size:.9em}
  pre{background:#0d2136;color:#cfe6df;padding:14px 16px;border-radius:10px;overflow:auto;margin:12px 0;font-family:'Consolas',ui-monospace,monospace;font-size:14px;border-left:3px solid var(--seafoam)}
  .btn{font-family:var(--body);font-weight:700;border:none;border-radius:9px;padding:11px 20px;cursor:pointer;font-size:15px;transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:var(--amber);color:var(--navy)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-teal{background:var(--teal);color:#fff}
  .btn-teal:hover{background:#186079}
  .btn-ghost{background:transparent;color:#fff;border:2px solid #34506c}
  .btn-ghost:hover{border-color:var(--seafoam)}

  /* ---------- Header ---------- */
  header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50;border-bottom:1px solid #1c3550}
  .top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 22px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:20px}
  .brand .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--seafoam),var(--teal));display:grid;place-items:center;color:#02121f;font-weight:800;font-size:18px}
  .brand small{color:var(--seafoam);font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:1px;display:block;margin-top:-3px}
  .top nav{display:flex;gap:6px;margin-left:8px}
  .top nav a{padding:7px 12px;border-radius:8px;font-size:14px;color:#c7d4df}
  .top nav a:hover,.top nav a.active{background:#16304c;color:#fff}
  .top .spacer{flex:1}
  .hud{display:flex;align-items:center;gap:14px}
  .hud .chip{display:flex;align-items:center;gap:6px;background:#16304c;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700}
  .hud .chip b{color:var(--amber)}
  .hud .chip.streak b{color:var(--coral)}
  .hud .chip.badge b{color:var(--seafoam)}

  /* ---------- Layout ---------- */
  main{max-width:1180px;margin:0 auto;padding:26px 22px 60px}
  .hero{background:var(--navy);color:#fff;border-radius:18px;padding:34px 34px;margin-bottom:26px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(33,176,168,.25),transparent 70%)}
  .hero h1{font-family:var(--head);font-size:32px;margin-bottom:8px}
  .hero p{color:#c7d4df;max-width:640px;font-size:16px}
  .hero .cta{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
  .stat .n{font-family:var(--head);font-size:26px;font-weight:700;color:var(--navy)}
  .stat .l{font-size:12px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px}
  .stat .bar{height:7px;background:#eef2f5;border-radius:6px;margin-top:8px;overflow:hidden}
  .stat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--seafoam),var(--amber))}

  .section-h{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}
  .section-h h2{font-family:var(--head);font-size:22px;color:var(--navy)}
  .section-h .filters{display:flex;gap:6px}
  .section-h .filters button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;color:var(--gray)}
  .section-h .filters button.active{background:var(--teal);color:#fff;border-color:var(--teal)}

  /* Path banner */
  .path{background:linear-gradient(120deg,var(--navy),var(--teal));color:#fff;border-radius:16px;padding:22px 24px;display:flex;align-items:center;gap:20px;margin-bottom:24px}
  .path .pico{width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:28px;flex-shrink:0}
  .path h3{font-family:var(--head);font-size:21px;margin-bottom:3px}
  .path p{color:#dce7ee;font-size:14px}
  .path .pbar{margin-top:10px;height:8px;background:rgba(255,255,255,.18);border-radius:6px;max-width:420px;overflow:hidden}
  .path .pbar i{display:block;height:100%;background:var(--amber)}

  /* Room cards */
  .rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
  .room{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
  .room:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(11,30,51,.12);border-color:var(--seafoam)}
  .room .rtop{height:74px;display:flex;align-items:center;padding:0 18px;gap:12px;color:#fff}
  .room .rtop .ic{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:22px}
  .room .rtop .rc{font-family:var(--head);font-weight:700;font-size:20px}
  .room .rbody{padding:14px 18px 16px;flex:1;display:flex;flex-direction:column}
  .room .rbody h4{font-size:17px;color:var(--navy);margin-bottom:6px}
  .room .rbody .desc{font-size:13.5px;color:var(--gray);flex:1;margin-bottom:12px}
  .room .meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--gray);margin-bottom:10px}
  .diff{font-weight:700;padding:2px 9px;border-radius:20px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .diff.facil{background:#e9f7ef;color:#1c6b3f}
  .diff.medio{background:#fef3e2;color:#a9700f}
  .diff.dificil{background:#fdece8;color:#a63a26}
  .room .rprog{height:7px;background:#eef2f5;border-radius:6px;overflow:hidden}
  .room .rprog i{display:block;height:100%;background:var(--seafoam)}
  .room .rprog.done i{background:var(--green)}
  .room .rfoot{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:8px;color:var(--gray)}
  .check{color:var(--green);font-weight:700}

  /* ---------- Room view ---------- */
  .roomview{display:grid;grid-template-columns:270px 1fr;gap:22px;align-items:start}
  .rv-side{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:78px}
  .rv-side .back{font-size:13px;color:var(--teal);font-weight:700;margin-bottom:12px;display:inline-block}
  .rv-side h3{font-family:var(--head);font-size:18px;color:var(--navy);margin-bottom:4px}
  .rv-side .subd{font-size:12px;color:var(--gray);margin-bottom:12px}
  .tasklist{list-style:none;display:flex;flex-direction:column;gap:4px}
  .tasklist li{padding:9px 11px;border-radius:9px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--ink)}
  .tasklist li:hover{background:#f2f6f9}
  .tasklist li.active{background:#eaf4f8;color:var(--navy);font-weight:700}
  .tasklist li .dot{width:19px;height:19px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-size:11px;color:#fff}
  .tasklist li.completed .dot{background:var(--green);border-color:var(--green)}
  .rv-side .rvprog{height:8px;background:#eef2f5;border-radius:6px;margin-top:14px;overflow:hidden}
  .rv-side .rvprog i{display:block;height:100%;background:linear-gradient(90deg,var(--seafoam),var(--amber))}
  .rv-side .rvpct{font-size:12px;color:var(--gray);text-align:center;margin-top:6px}

  .rv-main{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 30px;min-height:400px}
  .rv-main .tasktag{font-size:12px;color:var(--teal);font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .rv-main h2{font-family:var(--head);font-size:25px;color:var(--navy);margin:4px 0 16px}
  .rv-main .content p{margin:10px 0;font-size:15.5px}
  .rv-main .content ul{margin:10px 0 10px 4px;list-style:none}
  .rv-main .content li{position:relative;padding:6px 0 6px 22px;font-size:15px}
  .rv-main .content li::before{content:"";position:absolute;left:2px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--seafoam)}
  .rv-main .content strong{color:var(--navy)}
  .callout{background:#eef6f9;border-left:4px solid var(--teal);border-radius:0 10px 10px 0;padding:12px 16px;margin:14px 0;font-size:14.5px}
  .callout.warn{background:#fdf3ee;border-left-color:var(--coral)}

  /* Questions */
  .qbox{background:#f7fafb;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:16px 0}
  .qbox .qh{font-size:12px;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:flex;justify-content:space-between}
  .qbox .qh .pts{color:var(--amber)}
  .qbox .qq{font-weight:600;font-size:15.5px;color:var(--navy);margin-bottom:12px}
  .ansrow{display:flex;gap:8px;flex-wrap:wrap}
  .ansrow input{flex:1;min-width:180px;border:2px solid var(--line);border-radius:9px;padding:10px 13px;font-size:15px;font-family:var(--body)}
  .ansrow input:focus{outline:none;border-color:var(--seafoam)}
  .ansrow input.ok{border-color:var(--green);background:#e9f7ef}
  .qbox.solved{border-color:var(--green);background:#e9f7ef}
  .qmsg{font-size:13.5px;margin-top:9px;display:none}
  .qmsg.ok{display:block;color:var(--green);font-weight:600}
  .qmsg.no{display:block;color:var(--coral);font-weight:600}
  .hintbtn{background:none;border:none;color:var(--teal);font-size:13px;cursor:pointer;text-decoration:underline;margin-top:8px;padding:0}
  .hinttext{display:none;font-size:13.5px;color:var(--gray);margin-top:6px;font-style:italic}
  .flagq input{font-family:'Consolas',monospace}

  .navrow{display:flex;justify-content:space-between;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}

  /* Badges view */
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .bcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;opacity:.45;filter:grayscale(1);transition:.2s}
  .bcard.earned{opacity:1;filter:none;border-color:var(--seafoam);box-shadow:0 6px 18px rgba(33,176,168,.15)}
  .bcard .bic{font-size:38px;margin-bottom:8px}
  .bcard h4{font-size:15px;color:var(--navy);margin-bottom:4px}
  .bcard p{font-size:12px;color:var(--gray)}

  footer{text-align:center;color:var(--gray);font-size:13px;padding:26px;border-top:1px solid var(--line);margin-top:20px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:14px 22px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;z-index:200;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);max-width:90vw}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast .tic{font-size:26px}
  .toast b{color:var(--amber)}

  @media(max-width:820px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .roomview{grid-template-columns:1fr}
    .rv-side{position:static}
    .top nav{display:none}
  }
</style>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#/">
        <span class="logo">◐</span>
        <span>CyberLab CBT<small>OCEAN FORENSIC</small></span>
      </a>
      <nav id="mainnav">
        <a href="#/" data-route="home">Inicio</a>
        <a href="#/badges" data-route="badges">Insignias</a>
      </nav>
      <div class="spacer"></div>
      <div class="hud">
        <span class="chip" title="Puntos">◆ <b id="hud-points">0</b></span>
        <span class="chip streak" title="Racha de días">🔥 <b id="hud-streak">0</b></span>
        <span class="chip badge" title="Insignias">🏅 <b id="hud-badges">0</b></span>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <footer>
    CyberLab CBT · Plataforma de práctica · Ciberseguridad y Forense Digital · CBT · SECTI Estado de México<br>
    <span style="font-size:12px">Tu progreso se guarda en este navegador (localStorage). Prototipo educativo.</span>
  </footer>

  <div class="toast" id="toast"><span class="tic">🏅</span><span id="toast-txt"></span></div>

<script>
/* ============================================================
   CyberLab CBT — plataforma tipo TryHackMe (autocontenida)
   Para agregar contenido: edita el objeto DATA de abajo.
   Cada "room" = una lección con "tasks" (pasos). Cada task
   puede tener "questions" con respuestas (texto o flag).
   ============================================================ */

const DATA = {
  paths: [
    {
      id: "web-arch",
      icon: "🛡️",
      title: "Seguridad en Arquitecturas de Aplicaciones Web",
      desc: "Tema 2 — Diseña, protege, automatiza y observa aplicaciones web modernas.",
      rooms: ["r21","r22","r23","r24"]
    }
  ],
  rooms: {
    r21: {
      code: "2.1", color: "#1C7293", icon: "🏗️", difficulty: "facil", minutes: 25,
      title: "Diseño de arquitecturas seguras y escalables",
      desc: "Principios de diseño seguro, patrones y escalabilidad sin sacrificar seguridad.",
      tasks: [
        { title: "Introducción", questions: [], content:
          "<p>La seguridad de una aplicación web se decide en su <strong>arquitectura</strong>: cómo se separan los componentes, por dónde entra y sale la información y quién puede hablar con quién. Un buen diseño reduce la superficie de ataque desde el origen.</p>"+
          "<div class='callout'>Analogía: la arquitectura es como los muros de carga de una casa. La pintura (el código) se cambia fácil; mover un muro es una obra mayor. Si la bóveda da a la calle, ninguna cerradura la salva.</div>"+
          "<p>En esta sala repasarás los principios que hacen segura y escalable a una arquitectura. Avanza por las tareas de la izquierda y responde para ganar puntos.</p>" },
        { title: "Principios de diseño seguro", content:
          "<p>Memoriza estos principios: aparecen en normas, auditorías y entrevistas de trabajo.</p>"+
          "<ul>"+
          "<li><strong>Defensa en profundidad:</strong> varias capas independientes. Si el WAF falla, aún hay validación en la app y permisos mínimos en la base de datos.</li>"+
          "<li><strong>Mínimo privilegio:</strong> cada componente recibe solo los permisos que necesita. Un servicio de reportes solo necesita leer, nunca borrar.</li>"+
          "<li><strong>Zero Trust (NIST SP 800-207):</strong> «nunca confíes, siempre verifica». Ni la red interna se considera segura por sí misma.</li>"+
          "<li><strong>Fail secure:</strong> ante la duda, denegar. Un token que no se puede validar se rechaza.</li>"+
          "<li><strong>Secure by default:</strong> la opción segura viene activada de fábrica.</li>"+
          "</ul>",
          questions: [
            { q: "¿Cómo se llama el principio que dice «nunca confíes, siempre verifica», donde ni la red interna se considera segura?", a:["zero trust","zerotrust","confianza cero"], pts:20, hint:"Dos palabras en inglés; el estándar es NIST SP 800-207." },
            { q: "¿Qué principio establece que cada componente reciba solo los permisos estrictamente necesarios?", a:["minimo privilegio","mínimo privilegio","least privilege","privilegio minimo"], pts:20, hint:"Lo contrario de dar permisos de administrador «para que jale»." }
          ] },
        { title: "Patrones y escalabilidad segura", content:
          "<p>Cada estilo arquitectónico tiene ventajas y riesgos. Los <strong>microservicios</strong> aíslan fallos pero multiplican los endpoints a proteger; la comunicación entre ellos debe cifrarse y autenticarse (mTLS).</p>"+
          "<p>Para <strong>escalar horizontalmente</strong> (añadir más instancias ante mucha carga) la aplicación no debe guardar la sesión en su memoria local: se externaliza en tokens firmados o en Redis. A esto se le llama ser <em>stateless</em> (sin estado).</p>"+
          "<div class='callout warn'>Regla de oro de segmentación: la base de datos <strong>nunca</strong> debe tener IP pública. Vive en una subred privada, aislada de Internet.</div>",
          questions: [
            { q: "Para poder escalar horizontalmente, la sesión no se guarda en la instancia. ¿Cómo se le llama a este diseño? (una palabra)", a:["stateless","sin estado"], pts:25, hint:"En inglés: 'state' = estado; el prefijo niega." },
            { q: "¿En qué tipo de subred debe estar la base de datos, sin salida a Internet?", a:["privada","subred privada","aislada"], pts:15 }
          ] },
        { title: "🚩 Reto: contén el daño", content:
          "<p>En una tienda en línea: el cliente habla con un balanceador (con WAF); detrás, en subred privada, viven microservicios <code>catalogo</code>, <code>carrito</code>, <code>pagos</code> y <code>usuarios</code>. <code>pagos</code> no puede leer la tabla de usuarios y la BD no tiene IP pública.</p>"+
          "<p>Si un atacante compromete <code>catalogo</code>, <strong>no</strong> obtiene las tarjetas: la segmentación y el mínimo privilegio contienen el daño. El principio que evita que un componente comprometido toque a otro se llama «separación de responsabilidades».</p>"+
          "<div class='callout'>Captura la bandera escribiendo el nombre del principio (en el formato de flag) que permite <em>contener</em> un compromiso: <code>CBT{separacion_de_responsabilidades}</code></div>",
          questions: [
            { q: "Envía la bandera de esta sala:", a:["cbt{separacion_de_responsabilidades}"], pts:30, flag:true, hint:"Está escrita completa en el recuadro azul de arriba." }
          ] }
      ]
    },
    r22: {
      code: "2.2", color: "#21B0A8", icon: "🔌", difficulty: "medio", minutes: 30,
      title: "Protección de APIs y servicios web",
      desc: "OWASP API Top 10, autenticación vs. autorización, límites y gateways.",
      tasks: [
        { title: "La API como puerta programática", questions: [], content:
          "<p>El frontend es el mesero; la <strong>API</strong> es la ventanilla de la cocina. La consumen máquinas —rápido, masivo, 24/7— así que un atacante puede probar miles de combinaciones por segundo. Por eso los controles automáticos son indispensables.</p>" },
        { title: "OWASP API Security Top 10 — BOLA", content:
          "<p>OWASP publica los riesgos más críticos de APIs. El número uno es <strong>BOLA</strong> (Broken Object Level Authorization): el atacante cambia un identificador y accede a datos ajenos.</p>"+
          "<pre>GET /api/facturas/501   → mi factura (correcto)\nGET /api/facturas/502   → ¡la factura de otro usuario!  ← BOLA</pre>"+
          "<p>La causa: el servidor autenticó (sabe quién eres) pero no verificó que <em>ese objeto</em> sea tuyo. La solución no es esconder el número, sino comprobar la propiedad en el servidor, en cada petición.</p>",
          questions: [
            { q: "¿Qué sigla (4 letras) nombra el fallo de cambiar un id para ver datos de otro usuario?", a:["bola"], pts:25, hint:"Broken Object Level Authorization." },
            { q: "¿Esconder el id o usar ids aleatorios es una solución real a BOLA? (sí/no)", a:["no"], pts:15, hint:"Eso es «seguridad por oscuridad»." }
          ] },
        { title: "Autenticación, autorización y controles", content:
          "<ul>"+
          "<li><strong>Autenticar</strong> = demostrar quién eres. <strong>Autorizar</strong> = qué puedes hacer. Son cosas distintas y ambas importan.</li>"+
          "<li><strong>JWT:</strong> token firmado; siempre valida firma, emisor y expiración.</li>"+
          "<li><strong>Rate limiting:</strong> limita peticiones por minuto; frena la fuerza bruta y el abuso.</li>"+
          "<li><strong>API Gateway + WAF:</strong> entrada única que autentica y registra, más un filtro de patrones de ataque conocidos.</li>"+
          "</ul>",
          questions: [
            { q: "El control que limita cuántas peticiones por minuto acepta un cliente se llama rate ______ (una palabra en inglés):", a:["limiting","limit"], pts:20 },
            { q: "Verificar tu identidad es autenticación. Determinar qué puedes hacer es ______:", a:["autorizacion","autorización","authorization"], pts:20 }
          ] }
      ]
    },
    r23: {
      code: "2.3", color: "#E8A33D", icon: "⚙️", difficulty: "medio", minutes: 28,
      title: "DevSecOps en entornos web",
      desc: "Shift-left, pipeline CI/CD con compuertas, SAST/DAST/SCA.",
      tasks: [
        { title: "Shift-left", questions: [], content:
          "<p>Antes la seguridad se revisaba al final, cuando corregir era caro. <strong>DevSecOps</strong> integra la seguridad en cada etapa, de forma automática y temprana. La idea central es <strong>shift-left</strong>: mover los controles hacia el inicio de la línea de tiempo.</p>"+
          "<div class='callout'>Es más barato corregir los cimientos cuando la casa es un plano que cuando ya está construida.</div>" },
        { title: "El pipeline con compuertas de seguridad", content:
          "<p>El pipeline es la banda transportadora que lleva el código del repositorio a producción. En cada etapa hay un inspector automático; si algo crítico falla, la banda se <strong>detiene</strong>.</p>"+
          "<pre>commit → build → test → deploy → producción\n  │       │       │        │\n secret   SCA    SAST/DAST  escaneo de\n scan            (pruebas)  contenedor/IaC</pre>",
          questions: [
            { q: "¿Cómo se llama el enfoque de mover la seguridad al inicio del ciclo? (dos palabras con guion o espacio)", a:["shift-left","shift left","shiftleft"], pts:25 }
          ] },
        { title: "SAST, DAST y SCA", content:
          "<ul>"+
          "<li><strong>SAST:</strong> analiza el <em>código en reposo</em>, sin ejecutarlo. Como una radiografía.</li>"+
          "<li><strong>DAST:</strong> ataca la <em>app en ejecución</em> sin ver el código. Como una prueba de esfuerzo.</li>"+
          "<li><strong>SCA:</strong> revisa las <em>dependencias de terceros</em> en busca de vulnerabilidades conocidas (CVE).</li>"+
          "</ul>",
          questions: [
            { q: "¿Qué técnica analiza el código fuente SIN ejecutar la aplicación? (sigla)", a:["sast"], pts:20, hint:"Static Application Security Testing." },
            { q: "¿Qué técnica revisa las librerías de terceros buscando CVE conocidos? (sigla)", a:["sca"], pts:20, hint:"Software Composition Analysis." }
          ] }
      ]
    },
    r24: {
      code: "2.4", color: "#E2654A", icon: "📡", difficulty: "medio", minutes: 30,
      title: "Monitoreo y logging avanzado",
      desc: "Observabilidad, qué registrar, SIEM, correlación y detección.",
      tasks: [
        { title: "Los ojos y oídos del sistema", questions: [], content:
          "<p>Ninguna defensa es perfecta; por eso necesitamos ver qué ocurre dentro. Los <strong>logs</strong> y el <strong>monitoreo</strong> permiten detectar ataques y, tras un incidente, reconstruir qué pasó (esto conecta con el forense digital del curso).</p>"+
          "<div class='callout'>Lo que no se registra, no se puede investigar.</div>" },
        { title: "Qué registrar… y qué NUNCA", content:
          "<p>Un buen log incluye siempre <strong>cuándo, quién, desde dónde y qué</strong> (fecha, usuario, IP, recurso).</p>"+
          "<div class='callout warn'>Nunca registres en claro contraseñas, tokens ni números de tarjeta: registrar eso crea una nueva fuga de datos y viola normas de privacidad.</div>"+
          "<p>Además, protege la <strong>integridad</strong> de los logs: un atacante intenta borrar sus huellas, por eso se centralizan y se hacen de solo-anexado.</p>",
          questions: [
            { q: "¿Se deben guardar las contraseñas en claro dentro de los logs? (sí/no)", a:["no"], pts:15 }
          ] },
        { title: "SIEM y correlación", content:
          "<p>Con muchos servidores, revisar archivos por separado es inviable. Se centralizan y encima va un <strong>SIEM</strong>, que recibe eventos de todo el entorno, los <strong>correlaciona</strong> y genera alertas.</p>"+
          "<p>La correlación une pistas: un login fallido es ruido; 500 fallidos desde una IP seguidos de uno exitoso cuentan una historia (fuerza bruta con éxito).</p>",
          questions: [
            { q: "¿Qué plataforma recibe, correlaciona y alerta sobre eventos de seguridad de todo el entorno? (sigla)", a:["siem"], pts:25, hint:"Security Information and Event Management." },
            { q: "Unir pistas de distintas fuentes para revelar un patrón se llama:", a:["correlacion","correlación"], pts:20 }
          ] },
        { title: "🚩 Reto: guardia nocturna", content:
          "<p>A las 3:14 am el SIEM detecta 480 logins fallidos para <code>admin</code> desde una IP en menos de 2 minutos. El intento 481 fue <strong>exitoso</strong>: la severidad sube a crítica y se genera una alerta. Gracias a logs centralizados e íntegros se reconstruyó la línea de tiempo para el reporte forense.</p>"+
          "<div class='callout'>Bandera de la sala: <code>CBT{correlacion_salva_la_noche}</code></div>",
          questions: [
            { q: "Envía la bandera:", a:["cbt{correlacion_salva_la_noche}"], pts:30, flag:true }
          ] }
      ]
    }
  },
  badges: [
    { id:"first",   ic:"🎯", name:"Primer paso",        cond:"Completa tu primera tarea" },
    { id:"r21",     ic:"🏗️", name:"Arquitecto",          cond:"Completa la sala 2.1" },
    { id:"r22",     ic:"🔌", name:"Cazador de APIs",     cond:"Completa la sala 2.2" },
    { id:"r23",     ic:"⚙️", name:"Ingeniero DevSecOps", cond:"Completa la sala 2.3" },
    { id:"r24",     ic:"📡", name:"Analista SOC",         cond:"Completa la sala 2.4" },
    { id:"flags",   ic:"🚩", name:"Capturabanderas",     cond:"Captura 2 banderas" },
    { id:"p200",    ic:"⭐", name:"200 puntos",           cond:"Acumula 200 puntos" },
    { id:"master",  ic:"👑", name:"Maestro del Tema 2",   cond:"Completa todas las salas" }
  ]
};

/* ---------- Estado / persistencia ---------- */
const KEY = "cyberlab_cbt_v1";
let S = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return s; }catch(e){}
  return { solved:{}, points:0, badges:[], streak:0, lastDay:null, flags:0 };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function touchStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(S.lastDay === today) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  S.streak = (S.lastDay === y) ? (S.streak||0)+1 : 1;
  S.lastDay = today; save();
}

/* ---------- Utilidades ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const norm = s => (s||"").toString().trim().toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const qid = (rid,ti,qi)=>rid+"-"+ti+"-"+qi;

function roomTaskCount(rid){ return DATA.rooms[rid].tasks.reduce((a,t)=>a+((t.questions||[]).length),0); }
function roomSolvedCount(rid){
  let n=0; DATA.rooms[rid].tasks.forEach((t,ti)=>(t.questions||[]).forEach((q,qi)=>{ if(S.solved[qid(rid,ti,qi)]) n++; })); return n;
}
function roomDone(rid){ const t=roomTaskCount(rid); return t>0 && roomSolvedCount(rid)===t; }
function taskDone(rid,ti){
  const t=DATA.rooms[rid].tasks[ti]; const qs=t.questions||[];
  if(qs.length===0) return !!S.solved[qid(rid,ti,"intro")];
  return qs.every((q,qi)=>S.solved[qid(rid,ti,qi)]);
}
function totalTasks(){ return Object.keys(DATA.rooms).reduce((a,r)=>a+roomTaskCount(r),0); }
function totalSolved(){ return Object.keys(DATA.rooms).reduce((a,r)=>a+roomSolvedCount(r),0); }
function rankName(p){
  if(p>=250) return "Experto"; if(p>=150) return "Avanzado";
  if(p>=70) return "Intermedio"; if(p>=1) return "Aprendiz"; return "Novato";
}

/* ---------- Insignias ---------- */
function checkBadges(){
  const add=[];
  const give=id=>{ if(!S.badges.includes(id)){ S.badges.push(id); add.push(id); } };
  if(totalSolved()>=1) give("first");
  if(roomDone("r21")) give("r21");
  if(roomDone("r22")) give("r22");
  if(roomDone("r23")) give("r23");
  if(roomDone("r24")) give("r24");
  if(S.flags>=2) give("flags");
  if(S.points>=200) give("p200");
  if(["r21","r22","r23","r24"].every(roomDone)) give("master");
  save();
  add.forEach(id=>{ const b=DATA.badges.find(x=>x.id===id); if(b) toast("🏅","¡Insignia desbloqueada! <b>"+b.name+"</b>"); });
}

/* ---------- Toast ---------- */
let toastT;
function toast(ic,html){
  const t=$("#toast"); $(".tic",t).textContent=ic; $("#toast-txt").innerHTML=html;
  t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600);
}

/* ---------- HUD ---------- */
function renderHUD(){
  $("#hud-points").textContent=S.points;
  $("#hud-streak").textContent=S.streak||0;
  $("#hud-badges").textContent=S.badges.length;
}

/* ---------- Router ---------- */
function router(){
  renderHUD();
  const h=location.hash||"#/";
  document.querySelectorAll("#mainnav a").forEach(a=>a.classList.remove("active"));
  if(h.startsWith("#/room/")) return renderRoom(h.split("/")[2]);
  if(h.startsWith("#/badges")){ $('[data-route=badges]').classList.add("active"); return renderBadges(); }
  $('[data-route=home]').classList.add("active");
  renderHome();
}

/* ---------- Vista: Home ---------- */
function renderHome(){
  const app=$("#app");
  const path=DATA.paths[0];
  const donePct=Math.round(totalSolved()/totalTasks()*100);
  const pathRooms=path.rooms;
  const pathDone=pathRooms.filter(roomDone).length;
  const pathPct=Math.round(pathRooms.reduce((a,r)=>a+roomSolvedCount(r),0)/pathRooms.reduce((a,r)=>a+roomTaskCount(r),0)*100);

  app.innerHTML = `
    <div class="hero">
      <h1>Aprende ciberseguridad, practicando</h1>
      <p>Salas guiadas con teoría, ejemplos y retos. Responde, gana puntos y desbloquea insignias. Tu progreso se guarda automáticamente.</p>
      <div class="cta">
        <a class="btn btn-primary" href="#/room/${firstUnfinished(pathRooms)}">${totalSolved()>0?"Continuar":"Comenzar ahora"} ▸</a>
        <a class="btn btn-ghost" href="#/badges">Ver insignias</a>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="n">${S.points}</span><span class="l">Puntos · ${rankName(S.points)}</span></div>
      <div class="stat"><span class="n">${totalSolved()}/${totalTasks()}</span><span class="l">Retos resueltos</span>
        <div class="bar"><i style="width:${donePct||0}%"></i></div></div>
      <div class="stat"><span class="n">${S.streak||0} 🔥</span><span class="l">Racha (días)</span></div>
      <div class="stat"><span class="n">${S.badges.length}/${DATA.badges.length}</span><span class="l">Insignias</span></div>
    </div>

    <div class="path">
      <div class="pico">${path.icon}</div>
      <div style="flex:1">
        <h3>${path.title}</h3>
        <p>${path.desc} · ${pathDone}/${pathRooms.length} salas completadas</p>
        <div class="pbar"><i style="width:${pathPct||0}%"></i></div>
      </div>
    </div>

    <div class="section-h">
      <h2>Salas</h2>
      <div class="filters" id="filters">
        <button class="active" data-f="all">Todas</button>
        <button data-f="facil">Fácil</button>
        <button data-f="medio">Medio</button>
        <button data-f="dificil">Difícil</button>
      </div>
    </div>
    <div class="rooms" id="roomgrid">${pathRooms.map(roomCard).join("")}</div>
  `;

  $("#filters").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    const f=b.dataset.f;
    $("#roomgrid").innerHTML = pathRooms.filter(r=>f==="all"||DATA.rooms[r].difficulty===f).map(roomCard).join("") || "<p style='color:var(--gray)'>Sin salas en este nivel.</p>";
  });
}
function firstUnfinished(rooms){ return rooms.find(r=>!roomDone(r)) || rooms[0]; }
function roomCard(rid){
  const r=DATA.rooms[rid];
  const total=roomTaskCount(rid), solved=roomSolvedCount(rid);
  const pct=total?Math.round(solved/total*100):0;
  const done=roomDone(rid);
  return `<a class="room" href="#/room/${rid}">
    <div class="rtop" style="background:${r.color}">
      <span class="ic">${r.icon}</span>
      <div><span class="rc">${r.code}</span></div>
    </div>
    <div class="rbody">
      <div class="meta"><span class="diff ${r.difficulty}">${r.difficulty}</span> · ⏱ ${r.minutes} min · ${total} retos</div>
      <h4>${r.title}</h4>
      <div class="desc">${r.desc}</div>
      <div class="rprog ${done?'done':''}"><i style="width:${pct}%"></i></div>
      <div class="rfoot"><span>${solved}/${total} resueltos</span>${done?'<span class="check">✓ Completada</span>':'<span>'+pct+'%</span>'}</div>
    </div>
  </a>`;
}

/* ---------- Vista: Room ---------- */
let CUR = { rid:null, ti:0 };
function renderRoom(rid){
  const r=DATA.rooms[rid]; if(!r){ location.hash="#/"; return; }
  CUR.rid=rid; if(CUR.ti>=r.tasks.length) CUR.ti=0;
  const app=$("#app");
  app.innerHTML=`<div class="roomview">
    <aside class="rv-side">
      <a class="back" href="#/">‹ Volver a salas</a>
      <h3>${r.code} · ${r.title}</h3>
      <div class="subd"><span class="diff ${r.difficulty}">${r.difficulty}</span> · ${roomTaskCount(rid)} retos</div>
      <ul class="tasklist" id="tasklist"></ul>
      <div class="rvprog"><i id="rvbar"></i></div>
      <div class="rvpct" id="rvpct"></div>
    </aside>
    <section class="rv-main" id="rvmain"></section>
  </div>`;
  drawTaskList(); drawTask();
}
function drawTaskList(){
  const r=DATA.rooms[CUR.rid];
  $("#tasklist").innerHTML = r.tasks.map((t,i)=>{
    const done=taskDone(CUR.rid,i);
    return `<li class="${i===CUR.ti?'active':''} ${done?'completed':''}" data-i="${i}">
      <span class="dot">${done?'✓':''}</span> ${t.title}</li>`;
  }).join("");
  $("#tasklist").querySelectorAll("li").forEach(li=>li.addEventListener("click",()=>{ CUR.ti=+li.dataset.i; drawTaskList(); drawTask(); window.scrollTo({top:0,behavior:'smooth'}); }));
  const total=roomTaskCount(CUR.rid), solved=roomSolvedCount(CUR.rid);
  const pct=total?Math.round(solved/total*100):0;
  $("#rvbar").style.width=pct+"%"; $("#rvpct").textContent=solved+"/"+total+" retos · "+pct+"%";
}
function drawTask(){
  const r=DATA.rooms[CUR.rid], t=r.tasks[CUR.ti];
  const qs=t.questions||[];
  let html=`<div class="tasktag">Tarea ${CUR.ti+1} de ${r.tasks.length}</div><h2>${t.title}</h2><div class="content">${t.content}</div>`;

  if(qs.length===0){
    const done=!!S.solved[qid(CUR.rid,CUR.ti,"intro")];
    html+=`<div class="navrow">
      <button class="btn btn-ghost" style="color:var(--navy);border-color:var(--line)" ${CUR.ti===0?'disabled style="opacity:.4"':''} onclick="go(-1)">‹ Anterior</button>
      <button class="btn btn-primary" onclick="markIntro()">${done?'Continuar ▸':'Entendido, continuar ▸'}</button>
    </div>`;
  } else {
    qs.forEach((q,qi)=>{
      const id=qid(CUR.rid,CUR.ti,qi);
      const solved=!!S.solved[id];
      html+=`<div class="qbox ${solved?'solved':''} ${q.flag?'flagq':''}" id="qb-${qi}">
        <div class="qh"><span>Reto ${qi+1}${q.flag?' · 🚩 Bandera':''}</span><span class="pts">+${q.pts} pts</span></div>
        <div class="qq">${q.q}</div>
        <div class="ansrow">
          <input type="text" id="ans-${qi}" placeholder="${q.flag?'CBT{...}':'Tu respuesta'}" value="${solved?'':''}" ${solved?'disabled class="ok"':''}>
          <button class="btn btn-teal" ${solved?'disabled style="opacity:.5"':''} onclick="answer(${qi})">${solved?'✓ Resuelto':'Enviar'}</button>
        </div>
        <div class="qmsg ${solved?'ok':''}" id="msg-${qi}">${solved?'✓ ¡Correcto!':''}</div>
        ${q.hint?`<button class="hintbtn" onclick="document.getElementById('hint-${qi}').style.display='block';this.style.display='none'">Mostrar pista</button><div class="hinttext" id="hint-${qi}">💡 ${q.hint}</div>`:''}
      </div>`;
    });
    html+=`<div class="navrow">
      <button class="btn btn-ghost" style="color:var(--navy);border-color:var(--line)" ${CUR.ti===0?'disabled style="opacity:.4"':''} onclick="go(-1)">‹ Anterior</button>
      <button class="btn btn-primary" ${CUR.ti===r.tasks.length-1?'disabled style="opacity:.4"':''} onclick="go(1)">Siguiente ▸</button>
    </div>`;
  }
  $("#rvmain").innerHTML=html;
  const first=$("#ans-0"); if(first) first.addEventListener("keydown",e=>{ if(e.key==="Enter") answer(0); });
}
window.go=function(d){
  const r=DATA.rooms[CUR.rid];
  CUR.ti=Math.max(0,Math.min(r.tasks.length-1,CUR.ti+d));
  drawTaskList(); drawTask(); window.scrollTo({top:0,behavior:'smooth'});
};
window.markIntro=function(){
  const id=qid(CUR.rid,CUR.ti,"intro");
  if(!S.solved[id]){ S.solved[id]=true; save(); touchStreak(); }
  go(1);
};
window.answer=function(qi){
  const r=DATA.rooms[CUR.rid], t=r.tasks[CUR.ti], q=t.questions[qi];
  const id=qid(CUR.rid,CUR.ti,qi);
  if(S.solved[id]) return;
  const val=norm($("#ans-"+qi).value);
  const msg=$("#msg-"+qi);
  if(!val){ msg.className="qmsg no"; msg.textContent="Escribe una respuesta."; return; }
  const ok=q.a.map(norm).includes(val) || q.a.map(norm).some(a=>a===val);
  if(ok){
    S.solved[id]=true; S.points+=q.pts; if(q.flag) S.flags=(S.flags||0)+1;
    save(); touchStreak();
    const inp=$("#ans-"+qi); inp.disabled=true; inp.classList.add("ok"); inp.value="✓";
    $("#qb-"+qi).classList.add("solved");
    msg.className="qmsg ok"; msg.innerHTML="✓ ¡Correcto! <b>+"+q.pts+" pts</b>";
    toast(q.flag?"🚩":"◆", (q.flag?"¡Bandera capturada! ":"¡Correcto! ")+"<b>+"+q.pts+" pts</b>");
    renderHUD(); drawTaskList(); checkBadges();
    if(roomDone(CUR.rid)) setTimeout(()=>toast("✅","¡Sala <b>"+r.code+"</b> completada!"),700);
  } else {
    msg.className="qmsg no"; msg.textContent="✗ No es correcto. Revisa la teoría e inténtalo de nuevo.";
  }
};

/* ---------- Vista: Insignias ---------- */
function renderBadges(){
  const app=$("#app");
  app.innerHTML=`<div class="section-h"><h2>Insignias · ${S.badges.length}/${DATA.badges.length}</h2></div>
   <p style="color:var(--gray);margin-bottom:18px">Desbloquea insignias completando salas, capturando banderas y acumulando puntos.</p>
   <div class="badges">${DATA.badges.map(b=>`
     <div class="bcard ${S.badges.includes(b.id)?'earned':''}">
       <div class="bic">${b.ic}</div><h4>${b.name}</h4><p>${b.cond}</p>
     </div>`).join("")}</div>`;
}

/* ---------- Init ---------- */
window.addEventListener("hashchange",router);
touchStreak(); checkBadges(); router();
</script>
</body>
</html>
